openapi: 3.0.3
info:
  title: Consultancy API
  version: 1.0.0
paths:
  /user/login:
    post:
      tags:
        - Users
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                            format: email
                          role:
                            type: string
                          businessId:
                            type: integer
                            nullable: true
                          assignedBranches:
                            type: array
                            items:
                              type: object
                      businessName:
                        type: string
                        nullable: true
                      businessLogo:
                        type: string
                        nullable: true
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        "401":
          description: Invalid email or password
  /user/register:
    post:
      tags:
        - Users
      summary: Register a new user for a business/branch
      description: >-
        Creates the user with status "Invitation Pending" and emails them an
        invite link (FRONTEND_DOMAIN + /verify-invite?query=<token>) to set
        their password via POST /user/accept-invite.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phoneNumber
                - role
                - businessId
                - branchId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                role:
                  type: string
                  enum:
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
                businessId:
                  type: integer
                branchId:
                  type: integer
      responses:
        "201":
          description: Invitation sent
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/resend-invite:
    post:
      tags:
        - Users
      summary: Resend a pending user's invite email
      description: >-
        Only allowed while the target user's status is still "Invitation
        Pending". Generates a fresh invite token/link and re-sends the invite
        email, updating inviteSentAt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: Invite resent
        "400":
          description: Validation failed, or user already accepted their invite
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: User not found
  /user/accept-invite:
    post:
      tags:
        - Users
      summary: Accept an invite - set password and activate the account
      description: >-
        Public endpoint. Verifies the invite token (embedded userId,
        businessId, branchId) from the query string, then sets the user's
        password, marks them active, and sets status to Active.
      parameters:
        - name: token
          in: query
          required: true
          description: Invite token from the emailed link's "query" parameter
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
                  format: password
      responses:
        "200":
          description: Invite accepted successfully
        "400":
          description: Validation failed, or invalid/expired invite token
        "401":
          description: Invalid or expired invite token
  /user/delete:
    patch:
      tags:
        - Users
      summary: Soft delete a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: User deleted successfully
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/update/{id}:
    patch:
      tags:
        - Users
      summary: Update a user's profile fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                businessId:
                  type: integer
                # role:
                #   type: string
                  enum:
                    - Business Admin
                    - Super Admin
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
      responses:
        "200":
          description: User updated successfully
        "400":
          description: Validation failed, or email already in use in this business
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: User not found
  /business/list-managers/{businessId}:
    get:
      tags:
        - Business
      summary: Get active managers for a business
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Managers fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Managers fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        role:
                          type: string
                        status:
                          type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /business/users/{businessId}:
    get:
      tags:
        - Business
      summary: Get users belonging to a business branch
      description: >-
        Accessible only by Business Admin and Manager. branchId is required.
        Business Admins get every user assigned to that branch. Managers only
        get results if the branch is one they themselves manage (per the
        UserBranch model) - otherwise an empty list is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: name
          in: query
          required: false
          description: Optional case-insensitive partial match on user name
          schema:
            type: string
        - name: branchId
          in: query
          required: true
          description: Only returns users assigned to this branch
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: Optional filter by a single role (see UserRoles in application.constants.js)
          schema:
            type: string
            enum:
              [
                "Business Admin",
                "Super Admin",
                "Manager",
                "Counselor",
                "Admission Team",
                "Sub Agent",
              ]
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Users fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Users fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        previousEmailAddress:
                          type: string
                          nullable: true
                        status:
                          type: string
                        isActive:
                          type: boolean
                        inviteSentAt:
                          type: string
                          format: date-time
                          nullable: true
                        inviteAcceptedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalPages:
                        type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch:
    get:
      tags:
        - Branch
      summary: Get paginated branches for the authenticated user's business
      description: Accessible only by Business Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Branches fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Branches fetched
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            branchCode:
                              type: string
                            businessId:
                              type: integer
                            city:
                              type: string
                            country:
                              type: string
                            address:
                              type: string
                            latitude:
                              type: number
                              nullable: true
                            longitude:
                              type: number
                              nullable: true
                            isActive:
                              type: boolean
                            managers:
                              type: array
                              description: Names of users with role Manager assigned to this branch
                              items:
                                type: string
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
    post:
      tags:
        - Branch
      summary: Create a branch and assign its initial manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - businessId
                - city
                - country
                - address
                # - userId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                businessId:
                  type: integer
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                userId:
                  type: integer
                  minimum: 1
                  description: User to assign as this branch's initial manager
      responses:
        "201":
          description: Branch created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch/{branchId}/status:
    patch:
      tags:
        - Branch
      summary: Mark a branch as active or inactive
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Branch status updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
  /branch/{branchId}:
    patch:
      tags:
        - Branch
      summary: Update a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                isActive:
                  type: boolean
      responses:
        "200":
          description: Branch updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
    delete:
      tags:
        - Branch
      summary: Soft delete a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branch deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
  /university/add:
    post:
      tags:
        - University
      summary: Create a university for a business
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - universityName
                - country
                - businessId
                - link
                - type
              properties:
                universityName:
                  type: string
                  minLength: 2
                  maxLength: 150
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                businessId:
                  type: integer
                link:
                  type: string
                  format: uri
                type:
                  type: string
                  enum: [Public, Private]
      responses:
        "201":
          description: University created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /university/course:
    post:
      tags:
        - University
      summary: Add a course to a university, optionally with its intake dates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - businessId
                - universityId
                - courseTitle
                - degreeLevel
                - tutionFee
              properties:
                businessId:
                  type: integer
                universityId:
                  type: integer
                courseTitle:
                  type: string
                degreeLevel:
                  type: string
                tutionFee:
                  type: number
                tutionFeeCurrency:
                  type: string
                tutionPeriod:
                  type: string
                courseRequirements:
                  type: string
                isActive:
                  type: boolean
                intakeDates:
                  type: array
                  description: Optional intake dates created together with the course
                  items:
                    type: string
                    format: date
      responses:
        "201":
          description: Course created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /university/course/{courseId}:
    patch:
      tags:
        - University
      summary: Update a university course
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseTitle:
                  type: string
                degreeLevel:
                  type: string
                tutionFee:
                  type: number
                tutionFeeCurrency:
                  type: string
                tutionPeriod:
                  type: string
                courseRequirements:
                  type: string
                isActive:
                  type: boolean
      responses:
        "200":
          description: Course updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Course not found
    delete:
      tags:
        - University
      summary: Soft delete a university course
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Course not found
  /university/requirement:
    post:
      tags:
        - University
      summary: Add a requirement to a university
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - universityId
                - title
                - details
              properties:
                universityId:
                  type: integer
                title:
                  type: string
                details:
                  type: string
                sortOrder:
                  type: integer
      responses:
        "201":
          description: Requirement created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /university/requirement/{requirementId}:
    patch:
      tags:
        - University
      summary: Update a university requirement
      security:
        - bearerAuth: []
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: integer
        - name: universityId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                details:
                  type: string
                sortOrder:
                  type: integer
      responses:
        "200":
          description: Requirement updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Requirement not found
    delete:
      tags:
        - University
      summary: Soft delete a university requirement
      security:
        - bearerAuth: []
      parameters:
        - name: requirementId
          in: path
          required: true
          schema:
            type: integer
        - name: universityId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requirement deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Requirement not found
  /university/details/{universityId}:
    get:
      tags:
        - University
      summary: Get a university's details, courses, and requirements
      security:
        - bearerAuth: []
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: University details fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: University details fetched
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      universityName:
                        type: string
                      country:
                        type: string
                      link:
                        type: string
                      type:
                        type: string
                        enum: [Public, Private]
                      businessId:
                        type: integer
                      universityRequirements:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            details:
                              type: string
                            sortOrder:
                              type: integer
                      universityCourses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            courseTitle:
                              type: string
                            degreeLevel:
                              type: string
                            tutionFee:
                              type: number
                            tutionFeeCurrency:
                              type: string
                              nullable: true
                            tutionPeriod:
                              type: string
                              nullable: true
                            courseRequirements:
                              type: string
                              nullable: true
                            universityIntakeDates:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  date:
                                    type: string
                                    format: date
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: University not found
  /university/{universityId}:
    patch:
      tags:
        - University
      summary: Update a university
      security:
        - bearerAuth: []
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                universityName:
                  type: string
                country:
                  type: string
                link:
                  type: string
                type:
                  type: string
                  enum: [Public, Private]
                isActive:
                  type: boolean
      responses:
        "200":
          description: University updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: University not found
  /university/{businessId}:
    get:
      tags:
        - University
      summary: Get a paginated list of universities for a business
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: universityName
          in: query
          required: false
          description: Optional filter to search universities by name (partial, case-insensitive)
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Universities fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Universities fetched
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            universityName:
                              type: string
                            country:
                              type: string
                            link:
                              type: string
                            type:
                              type: string
                              enum: [Public, Private]
                            businessId:
                              type: integer
                            courseCount:
                              type: integer
                              description: Count of active, non-deleted courses for this university
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT