openapi: 3.0.3
info:
  title: Consultancy API
  version: 1.0.0
paths:
  /user/login:
    post:
      tags:
        - Users
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                            format: email
                          role:
                            type: string
                          businessId:
                            type: integer
                            nullable: true
                          assignedBranches:
                            type: array
                            items:
                              type: object
                      businessName:
                        type: string
                        nullable: true
                      businessLogo:
                        type: string
                        nullable: true
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        "401":
          description: Invalid email or password
  /user/register:
    post:
      tags:
        - Users
      summary: Register a new user for a business/branch
      description: >-
        Creates the user with status "Invitation Pending" and emails them an
        invite link (FRONTEND_DOMAIN + /verify-invite?query=<token>) to set
        their password via POST /user/accept-invite.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phoneNumber
                - role
                - businessId
                - branchId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                role:
                  type: string
                  enum:
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
                businessId:
                  type: integer
                branchId:
                  type: integer
      responses:
        "201":
          description: Invitation sent
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/resend-invite:
    post:
      tags:
        - Users
      summary: Resend a pending user's invite email
      description: >-
        Only allowed while the target user's status is still "Invitation
        Pending". Generates a fresh invite token/link and re-sends the invite
        email, updating inviteSentAt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: Invite resent
        "400":
          description: Validation failed, or user already accepted their invite
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: User not found
  /user/accept-invite:
    post:
      tags:
        - Users
      summary: Accept an invite - set password and activate the account
      description: >-
        Public endpoint. Verifies the invite token (embedded userId,
        businessId, branchId) from the query string, then sets the user's
        password, marks them active, and sets status to Active.
      parameters:
        - name: token
          in: query
          required: true
          description: Invite token from the emailed link's "query" parameter
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
                  format: password
      responses:
        "200":
          description: Invite accepted successfully
        "400":
          description: Validation failed, or invalid/expired invite token
        "401":
          description: Invalid or expired invite token
  /user/delete:
    patch:
      tags:
        - Users
      summary: Soft delete a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: User deleted successfully
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/update/{id}:
    patch:
      tags:
        - Users
      summary: Update a user's profile fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                businessId:
                  type: integer
                # role:
                #   type: string
                  enum:
                    - Business Admin
                    - Super Admin
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
      responses:
        "200":
          description: User updated successfully
        "400":
          description: Validation failed, or email already in use in this business
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: User not found
  /business/list-managers/{businessId}:
    get:
      tags:
        - Business
      summary: Get active managers for a business
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Managers fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Managers fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        role:
                          type: string
                        status:
                          type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /business/users/{businessId}:
    get:
      tags:
        - Business
      summary: Get users belonging to a business branch
      description: >-
        Accessible only by Business Admin and Manager. branchId is required.
        Business Admins get every user assigned to that branch. Managers only
        get results if the branch is one they themselves manage (per the
        UserBranch model) - otherwise an empty list is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: name
          in: query
          required: false
          description: Optional case-insensitive partial match on user name
          schema:
            type: string
        - name: branchId
          in: query
          required: true
          description: Only returns users assigned to this branch
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: Optional filter by a single role (see UserRoles in application.constants.js)
          schema:
            type: string
            enum:
              [
                "Business Admin",
                "Super Admin",
                "Manager",
                "Counselor",
                "Admission Team",
                "Sub Agent",
              ]
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Users fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Users fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        previousEmailAddress:
                          type: string
                          nullable: true
                        status:
                          type: string
                        isActive:
                          type: boolean
                        inviteSentAt:
                          type: string
                          format: date-time
                          nullable: true
                        inviteAcceptedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalPages:
                        type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /business/admission-team/{businessId}:
    get:
      tags:
        - Business
      summary: Get the Admission Team users for a business
      description: >-
        Accessible by Super Admin, Business Admin, Manager and Counselor.
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admission team fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Admission team fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch:
    get:
      tags:
        - Branch
      summary: Get paginated branches for the authenticated user's business
      description: Accessible only by Business Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Branches fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Branches fetched
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            branchCode:
                              type: string
                            businessId:
                              type: integer
                            city:
                              type: string
                            country:
                              type: string
                            address:
                              type: string
                            latitude:
                              type: number
                              nullable: true
                            longitude:
                              type: number
                              nullable: true
                            isActive:
                              type: boolean
                            managers:
                              type: array
                              description: Names of users with role Manager assigned to this branch
                              items:
                                type: string
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
    post:
      tags:
        - Branch
      summary: Create a branch and assign its initial manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - businessId
                - city
                - country
                - address
                # - userId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                businessId:
                  type: integer
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                userId:
                  type: integer
                  minimum: 1
                  description: User to assign as this branch's initial manager
      responses:
        "201":
          description: Branch created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch/{branchId}/status:
    patch:
      tags:
        - Branch
      summary: Mark a branch as active or inactive
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Branch status updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
  /branch/{branchId}:
    patch:
      tags:
        - Branch
      summary: Update a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                isActive:
                  type: boolean
      responses:
        "200":
          description: Branch updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
    delete:
      tags:
        - Branch
      summary: Soft delete a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branch deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
  /branch/{branchId}/counselors:
    get:
      tags:
        - Branch
      summary: Get users with role Counselor assigned to a branch
      description: Accessible only by Manager and Business Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
        - name: organizationId
          in: query
          required: true
          description: Business the branch belongs to
          schema:
            type: integer
      responses:
        "200":
          description: Counselors fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Counselors fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        "400":
          description: Validation failed - missing organizationId
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
  /student:
    post:
      tags:
        - Student
      summary: Create a student
      description: Accessible by Sub Agent, Counselor, Manager and Business Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNo
                - businessId
                - branchId
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 150
                email:
                  type: string
                  format: email
                phoneNo:
                  type: string
                  minLength: 2
                businessId:
                  type: integer
                branchId:
                  type: integer
                preferredTargetCountries:
                  type: array
                  items:
                    type: string
                targetDegree:
                  type: string
                counselorId:
                  type: integer
                  minimum: 1
                  description: User to assign as this student's counselor
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Student created
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      studentNo:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string
                      phoneNo:
                        type: string
                      businessId:
                        type: integer
                      branchId:
                        type: integer
                      preferredTargetCountries:
                        type: array
                        items:
                          type: string
                      targetDegree:
                        type: string
                        nullable: true
                      leadStage:
                        type: string
                      counselorId:
                        type: integer
                        nullable: true
                      isActive:
                        type: boolean
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Business or branch not found
  /student/counselor:
    patch:
      tags:
        - Student
      summary: Assign or reassign one or more students to a counselor
      description: >-
        Accessible by Manager and Business Admin. counselorId is required but
        nullable - pass null to unassign (matches the "Unassigned" option in
        the Assign Counselor dialog). Same endpoint handles both an initial
        assignment and a reassignment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentIds
                - counselorId
              properties:
                studentIds:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                counselorId:
                  type: integer
                  nullable: true
                  description: Must reference an active Counselor in the caller's business, or null to unassign
      responses:
        "200":
          description: Student counselor assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Student counselor assigned
                  data:
                    type: object
                    properties:
                      studentIds:
                        type: array
                        items:
                          type: integer
                      counselorId:
                        type: integer
                        nullable: true
        "400":
          description: Validation failed, or counselorId doesn't reference an active Counselor in this business
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: One or more students were not found
  /student/{studentId}:
    patch:
      tags:
        - Student
      summary: Edit a student record's contact details, target countries, and stage
      description: >-
        Accessible by Manager and Business Admin. At least one field must be
        provided.
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 150
                email:
                  type: string
                  format: email
                phoneNo:
                  type: string
                  minLength: 2
                preferredTargetCountries:
                  type: array
                  items:
                    type: string
                targetDegree:
                  type: string
                leadStage:
                  type: string
                  enum:
                    [
                      "NewLead",
                      "DocumentSubmitted",
                      "ApplicationSubmitted",
                      "VisaProcessing",
                      "Enrolled",
                    ]
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Student updated
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      fullName:
                        type: string
                      email:
                        type: string
                      phoneNo:
                        type: string
                      preferredTargetCountries:
                        type: array
                        items:
                          type: string
                      targetDegree:
                        type: string
                        nullable: true
                      leadStage:
                        type: string
        "400":
          description: Validation failed, or another student with this email/phone already exists on this branch
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Student not found
  /student/branch/{branchId}:
    get:
      tags:
        - Student
      summary: Get a paginated list of students for a branch
      description: >-
        Accessible by Sub Agent, Counselor, Manager and Business Admin.
        Scoped by the authenticated user's businessId and the branchId path
        param together.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: counselorId
          in: query
          required: false
          description: Optional filter by assigned counselor
          schema:
            type: integer
        - name: leadStage
          in: query
          required: false
          description: Optional filter by lead stage
          schema:
            type: string
            enum:
              [
                "NewLead",
                "DocumentSubmitted",
                "ApplicationSubmitted",
                "VisaProcessing",
                "Enrolled",
              ]
        - name: searchTerm
          in: query
          required: false
          description: Optional case-insensitive partial match on fullName, email, or phoneNo
          schema:
            type: string
      responses:
        "200":
          description: Students fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Students fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        studentNo:
                          type: string
                        fullName:
                          type: string
                        email:
                          type: string
                        phoneNo:
                          type: string
                        businessId:
                          type: integer
                        branchId:
                          type: integer
                        leadStage:
                          type: string
                        counselorId:
                          type: integer
                          nullable: true
                        isActive:
                          type: boolean
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      totalPages:
                        type: integer
        "400":
          description: Validation failed - missing branchId or invalid leadStage
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /student/{studentId}/target-universities:
    get:
      tags:
        - Student
      summary: Get a student's target universities
      description: >-
        Accessible by Sub Agent, Counselor, Manager and Business Admin.
        Returns every non-deleted target university for the student, each
        with its University (including universityRequirements), and its
        targetCourses (including the referenced UniversityCourses details).
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Target universities fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Target universities fetched
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TargetUniversity"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Student not found
    patch:
      tags:
        - Student
      summary: Update a student's target universities (remove then add)
      description: >-
        Accessible by Sub Agent, Counselor, Manager and Business Admin. If
        removedUniversities and/or removedCourses are provided, those are
        deleted first (removedUniversities entries are targetUniversityId
        values and cascade-delete their courses; removedCourses entries are
        targetCourseId values - any already removed via cascade are silently
        skipped). targetUniversities is then applied the same way the old
        add endpoint worked: existing (studentId, universityId) pairs, and
        existing (targetUniversityId, courseId) pairs for any newly/already
        added target university, are skipped instead of raising an error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUniversities
              properties:
                targetUniversities:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - universityId
                    properties:
                      universityId:
                        type: integer
                      courseIds:
                        type: array
                        items:
                          type: integer
                removedUniversities:
                  type: array
                  items:
                    type: integer
                  description: targetUniversityId values to delete before applying targetUniversities
                removedCourses:
                  type: array
                  items:
                    type: integer
                  description: targetCourseId values to delete before applying targetUniversities
              example:
                targetUniversities:
                  - universityId: 101
                    courseIds: [201, 202]
                  - universityId: 102
                    courseIds: []
                removedUniversities: [55]
                removedCourses: [90]
      responses:
        "200":
          description: Target universities updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Target universities updated
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TargetUniversity"
        "400":
          description: Validation failed, or an unknown university/course for this business
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Student, target university, or target course not found
  /student/{studentId}/target-universities/{targetUniversityId}:
    delete:
      tags:
        - Student
      summary: Delete a target university section
      description: >-
        Hard deletes the target university and, via cascade, every target
        course attached to it.
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: targetUniversityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Target university deleted
