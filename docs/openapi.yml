openapi: 3.0.3
info:
  title: Consultancy API
  version: 1.0.0
paths:
  /user/login:
    post:
      tags:
        - Users
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid email or password
  /user/register:
    post:
      tags:
        - Users
      summary: Register a new user for a business/branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - phoneNumber
                - role
                - businessId
                - branchId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                role:
                  type: string
                  enum:
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
                businessId:
                  type: integer
                branchId:
                  type: integer
      responses:
        "201":
          description: Invitation sent
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/delete:
    patch:
      tags:
        - Users
      summary: Soft delete a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: User deleted successfully
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /user/update/{id}:
    patch:
      tags:
        - Users
      summary: Update a user's profile fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                  minLength: 2
                businessId:
                  type: integer
                role:
                  type: string
                  enum:
                    - Business Admin
                    - Super Admin
                    - Manager
                    - Counselor
                    - Admission Team
                    - Sub Agent
      responses:
        "200":
          description: User updated successfully
        "400":
          description: Validation failed, or email already in use in this business
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: User not found
  /business/users/{businessId}:
    get:
      tags:
        - Business
      summary: Get users belonging to a business, including their branches
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Users fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Users fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        previousEmailAddress:
                          type: string
                          nullable: true
                        status:
                          type: string
                        inviteAcceptedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        branches:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              branchCode:
                                type: string
                              city:
                                type: string
                              country:
                                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch/{businessId}:
    get:
      tags:
        - Branch
      summary: Get active branches for a business, with their member count
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branches fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Branches fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        branchCode:
                          type: string
                        businessId:
                          type: integer
                        city:
                          type: string
                        country:
                          type: string
                        address:
                          type: string
                        latitude:
                          type: number
                          nullable: true
                        longitude:
                          type: number
                          nullable: true
                        isActive:
                          type: boolean
                        totalMembers:
                          type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch:
    post:
      tags:
        - Branch
      summary: Create a branch and assign its initial manager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - branchCode
                - businessId
                - city
                - country
                - address
                - userId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                branchCode:
                  type: string
                  minLength: 2
                  maxLength: 50
                businessId:
                  type: integer
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                userId:
                  type: integer
                  minimum: 1
                  description: User to assign as this branch's initial manager
      responses:
        "201":
          description: Branch created
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
  /branch/{branchId}:
    patch:
      tags:
        - Branch
      summary: Update a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
                city:
                  type: string
                  minLength: 2
                  maxLength: 90
                country:
                  type: string
                  minLength: 2
                  maxLength: 90
                address:
                  type: string
                  minLength: 2
                  maxLength: 250
                latitude:
                  type: number
                longitude:
                  type: number
                isActive:
                  type: boolean
      responses:
        "200":
          description: Branch updated
        "400":
          description: Validation failed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
    delete:
      tags:
        - Branch
      summary: Soft delete a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branch deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Branch not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT