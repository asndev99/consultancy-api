  /university/{businessId}:
    get:
      tags:
        - University
      summary: Get a paginated list of universities for a business
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: universityName
          in: query
          required: false
          description: Optional filter to search universities by name (partial, case-insensitive)
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          description: Optional filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Universities fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Universities fetched
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            universityName:
                              type: string
                            country:
                              type: string
                            link:
                              type: string
                            type:
                              type: string
                              enum: [Public, Private]
                            businessId:
                              type: integer
                            courseCount:
                              type: integer
                              description: Count of active, non-deleted courses for this university
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          totalPages:
                            type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
