  /university/targets/search:
    get:
      tags:
        - University
      summary: Search target universities for a student
      description: >-
        Fetches target universities (with their courses) for a student. No
        pagination. searchTerm matches against university name, country, or
        any of the university's course titles. If searchTerm is empty or
        omitted, every university for the authenticated user's business is
        returned along with its courses.
      security:
        - bearerAuth: []
      parameters:
        - name: searchTerm
          in: query
          required: false
          description: Optional case-insensitive partial match on university name, country, or course title
          schema:
            type: string
      responses:
        "200":
          description: Target universities fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: Target universities fetched
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        universityName:
                          type: string
                        country:
                          type: string
                        link:
                          type: string
                        type:
                          type: string
                          enum: [Public, Private]
                        businessId:
                          type: integer
                        universityCourses:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              courseTitle:
                                type: string
                              degreeLevel:
                                type: string
                              tutionFee:
                                type: number
                              tutionFeeCurrency:
                                type: string
                                nullable: true
                              tutionPeriod:
                                type: string
                                nullable: true
                              courseRequirements:
                                type: string
                                nullable: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
