services:
  db:
    image: 'postgres:18-alpine'
    container_name: consultancy-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    volumes:
      - 'consultancy-api-dbdata:/var/lib/postgresql/data'
